<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPTX Label Kit Match Review</title>
  <style>
    :root {
      --bg: #15120f;
      --panel: #241f1a;
      --panel-2: #302922;
      --line: #564a3e;
      --ink: #f2eadc;
      --muted: #b8aa98;
      --soft: #8d7f70;
      --ok: #8ebf9a;
      --no: #d47e68;
      --accent: #d8a754;
      --blue: #82aee6;
      --radius: 14px;
      --mono: "Cascadia Mono", Consolas, monospace;
      --sans: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 20% 0%, rgba(216, 167, 84, .18), transparent 30rem),
        linear-gradient(135deg, #15120f, #201a15 55%, #13110f);
      color: var(--ink);
      font-family: var(--sans);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(21, 18, 15, .94);
      backdrop-filter: blur(12px);
    }
    h1 { margin: 0; font-size: 20px; letter-spacing: .02em; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    button, input, select, textarea {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--ink);
      border-radius: 10px;
      padding: 9px 11px;
      font: inherit;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    main { padding: 18px 22px 34px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(36, 31, 26, .82);
      padding: 12px;
    }
    .stat b { display: block; font-size: 22px; }
    .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    .filters {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 170px 170px 130px;
      gap: 10px;
      margin-bottom: 16px;
    }
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
    }
    .pager-actions { display: flex; gap: 8px; align-items: center; }
    .list { display: grid; gap: 12px; }
    .card {
      display: grid;
      grid-template-columns: minmax(260px, 1.1fr) minmax(380px, 2fr) minmax(260px, .9fr);
      gap: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(36, 31, 26, .9);
      padding: 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,.24);
    }
    .label-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .meta, .reason, .small { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--muted);
      font-size: 12px;
      margin: 2px 4px 2px 0;
      background: rgba(0,0,0,.16);
    }
    .candidate {
      display: grid;
      grid-template-columns: 54px 1fr;
      gap: 10px;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(86, 74, 62, .75);
      margin-bottom: 8px;
      background: rgba(48, 41, 34, .7);
    }
    .score {
      font-family: var(--mono);
      font-weight: 700;
      color: var(--accent);
      text-align: right;
    }
    .kit { font-weight: 650; }
    .mono { font-family: var(--mono); }
    .decision {
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .choice-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .choice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px;
      background: rgba(0,0,0,.16);
      cursor: pointer;
      user-select: none;
    }
    .choice input { margin: 0; accent-color: var(--accent); }
    .choice.confirm.active { border-color: var(--ok); color: var(--ok); }
    .choice.decline.active { border-color: var(--no); color: var(--no); }
    .choice.skip.active { border-color: var(--blue); color: var(--blue); }
    textarea { min-height: 70px; resize: vertical; width: 100%; }
    .override { width: 100%; }
    .empty {
      text-align: center;
      padding: 46px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
    }
    @media (max-width: 1050px) {
      header, .filters, .card { grid-template-columns: 1fr; }
      .toolbar { justify-content: start; }
      .stats { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    }
  </style>
</head>

  <header>
    <div>
      <h1>PPTX Label Kit Match Review</h1>
      <div class="sub">Confirm or decline extracted PPTX overlay labels against kit table suggestions.</div>
    </div>
    <div class="toolbar">
      <button id="exportCsv">Export decisions CSV</button>
      <button id="exportJson">Export JSON</button>
      <button id="clearDecisions">Clear local decisions</button>
    </div>
  </header>
  <main>
    <section class="stats" id="stats"></section>
    <section class="filters">
      <input id="search" placeholder="Search label, kit, vendor, ID...">
      <select id="decisionFilter">
        <option value="all">All decisions</option>
        <option value="unreviewed">Unreviewed</option>
        <option value="confirm">Confirmed</option>
        <option value="decline">Declined</option>
        <option value="skip">Skipped / later</option>
      </select>
      <select id="confidenceFilter">
        <option value="all">All confidence</option>
        <option value="high">High: score >= 70</option>
        <option value="medium">Medium: 50-69.9</option>
        <option value="low">Low: 35-49.9</option>
        <option value="weak">Weak/no: < 35</option>
      </select>
      <select id="pageSize">
        <option value="25">25 per page</option>
        <option value="50" selected>50 per page</option>
        <option value="100">100 per page</option>
        <option value="9999">All</option>
      </select>
    </section>
    <section class="pager" id="pager"></section>
    <section class="list" id="list"></section>
  </main>

    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[ch]));
    }

    function renderStats(filtered = groups) {
      const counts = {
        total: groups.length,
        shown: filtered.length,
        confirm: groups.filter((g) => decisionFor(g.label).decision === "confirm").length,
        decline: groups.filter((g) => decisionFor(g.label).decision === "decline").length,
        unreviewed: groups.filter((g) => !decisionFor(g.label).decision).length,
      };
      document.getElementById("stats").innerHTML = [
        ["Total", counts.total],
        ["Shown", counts.shown],
        ["Confirmed", counts.confirm],
        ["Declined", counts.decline],
        ["Unreviewed", counts.unreviewed],
      ].map(([label, value]) => `<div class="stat"><b>${value}</b><span>${label}</span></div>`).join("");
    }

    function renderPager(filtered, pageCount) {
      const pager = document.getElementById("pager");
      const pageSize = Number(document.getElementById("pageSize").value);
      const start = filtered.length ? (currentPage - 1) * pageSize + 1 : 0;
      const end = Math.min(currentPage * pageSize, filtered.length);
      pager.innerHTML = `
        <div>Showing ${start}-${end} of ${filtered.length}</div>
        <div class="pager-actions">
          <button id="prevPage" ${currentPage <= 1 ? "disabled" : ""}>Previous</button>
          <span>Page ${currentPage} / ${pageCount || 1}</span>
          <button id="nextPage" ${currentPage >= pageCount ? "disabled" : ""}>Next</button>
        </div>`;
      document.getElementById("prevPage").addEventListener("click", () => {
        currentPage = Math.max(1, currentPage - 1);
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      document.getElementById("nextPage").addEventListener("click", () => {
        currentPage = Math.min(pageCount, currentPage + 1);
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    function render() {
      const search = document.getElementById("search").value.trim().toLowerCase();
      const decisionFilter = document.getElementById("decisionFilter").value;
      const confidenceFilter = document.getElementById("confidenceFilter").value;
      const pageSize = Number(document.getElementById("pageSize").value);
      const filtered = groups.filter((group) => {
        const decision = decisionFor(group.label).decision || "unreviewed";
        const haystack = [
          group.label,
          group.statuses,
          group.slides,
          ...group.candidates.flatMap((c) => [c.kit_id, c.kit_brand, c.kit_scale, c.kit_name, c.kit_serial, c.match_reasons]),
        ].join(" ").toLowerCase();
        return (!search || haystack.includes(search))
          && (decisionFilter === "all" || decision === decisionFilter)
          && (confidenceFilter === "all" || scoreBand(group) === confidenceFilter);
      });
      const pageCount = Math.max(1, Math.ceil(filtered.length / pageSize));
      currentPage = Math.min(currentPage, pageCount);
      const pageStart = (currentPage - 1) * pageSize;
      const visible = filtered.slice(pageStart, pageStart + pageSize);
      renderStats(filtered);
      renderPager(filtered, pageCount);
      const list = document.getElementById("list");
      if (!filtered.length) {
        list.innerHTML = `<div class="empty">No labels match the current filters.</div>`;
        return;
      }
      list.innerHTML = visible.map(renderCard).join("");
      bindCards();
    }

    function renderCard(group) {
      const current = decisionFor(group.label);
      const top = group.candidates[0] || {};
      const candidates = group.candidates.length
        ? group.candidates.map((c) => `
          <div class="candidate">
            <div class="score">${escapeHtml(c.score || "-")}</div>
            <div>
              <div class="kit"><span class="mono">#${escapeHtml(c.kit_id)}</span> ${escapeHtml(c.kit_brand)} ${escapeHtml(c.kit_scale)} ${escapeHtml(c.kit_name)}</div>
              <div class="meta">serial: ${escapeHtml(c.kit_serial || "-")}</div>
              <div class="reason">${escapeHtml(c.match_reasons || "")}</div>
            </div>
          </div>`).join("")
        : `<div class="candidate"><div class="score">-</div><div><div class="kit">No candidate</div><div class="reason">No match above threshold.</div></div></div>`;
      return `
        <article class="card" data-label="${escapeHtml(group.label)}">
          <div>
            <div class="label-title">${escapeHtml(group.label)}</div>
            <span class="pill">count ${escapeHtml(group.count)}</span>
            <span class="pill">${escapeHtml(scoreBand(group))}</span>
            <span class="pill">top ${escapeHtml(top.score || "-")}</span>
            <div class="meta">statuses: ${escapeHtml(group.statuses || "-")}</div>
            <div class="meta">slides: ${escapeHtml(group.slides || "-")}</div>
          </div>
          <div>${candidates}</div>
          <div class="decision">
            <div class="choice-row">
              ${renderChoice(group.label, current.decision, "confirm", "Confirm")}
              ${renderChoice(group.label, current.decision, "decline", "Decline")}
              ${renderChoice(group.label, current.decision, "skip", "Later")}
            </div>
            <input class="override" data-field="override_kit_id" value="${escapeHtml(current.override_kit_id || "")}" placeholder="Override kit ID (optional)">
            <textarea data-field="notes" placeholder="Review notes">${escapeHtml(current.notes || "")}</textarea>
            <div class="small">Confirm uses top candidate unless you enter an override kit ID.</div>
          </div>
        </article>`;
    }

    function renderChoice(label, selected, value, text) {
      const active = selected === value ? "active" : "";
      const checked = selected === value ? "checked" : "";
      return `<label class="choice ${value} ${active}">
        <input type="checkbox" data-decision="${value}" ${checked}>
        ${text}
      </label>`;
    }

    function bindCards() {
      document.querySelectorAll(".card").forEach((card) => {
        const label = card.dataset.label;
        card.querySelectorAll("[data-decision]").forEach((input) => {
          input.addEventListener("change", () => {
            const value = input.checked ? input.dataset.decision : "";
            setDecision(label, { decision: value });
          });
        });
        card.querySelectorAll("[data-field]").forEach((input) => {
          input.addEventListener("change", () => {
            setDecision(label, { [input.dataset.field]: input.value });
          });
        });
      });
    }

    function decisionRows() {
      return groups.map((group) => {
        const current = decisionFor(group.label);
        const top = group.candidates[0] || {};
        return {
          label_text: group.label,
          decision: current.decision || "",
          selected_kit_id: current.override_kit_id || (current.decision === "confirm" ? top.kit_id || "" : ""),
          top_score: top.score || "",
          top_kit_id: top.kit_id || "",
          top_kit_brand: top.kit_brand || "",
          top_kit_scale: top.kit_scale || "",
          top_kit_name: top.kit_name || "",
          top_kit_serial: top.kit_serial || "",
          notes: current.notes || "",
        };
      });
    }

    function toCsv(rows) {
      const headers = Object.keys(rows[0] || {});
      const quote = (value) => `"${String(value ?? "").replace(/"/g, '""')}"`;
      return [headers.join(","), ...rows.map((row) => headers.map((h) => quote(row[h])).join(","))].join("\n");
    }

    function download(filename, text, type) {
      const blob = new Blob([text], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById("search").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        currentPage = 1;
        render();
      }, 120);
    });
    document.getElementById("decisionFilter").addEventListener("change", () => {
      currentPage = 1;
      render();
    });
    document.getElementById("confidenceFilter").addEventListener("change", () => {
      currentPage = 1;
      render();
    });
    document.getElementById("pageSize").addEventListener("change", () => {
      currentPage = 1;
      render();
    });
    document.getElementById("exportCsv").addEventListener("click", () => {
      download("PptxLabelKitReviewDecisions.csv", toCsv(decisionRows()), "text/csv");
    });
    document.getElementById("exportJson").addEventListener("click", () => {
      download("PptxLabelKitReviewDecisions.json", JSON.stringify(decisionRows(), null, 2), "application/json");
    });
    document.getElementById("clearDecisions").addEventListener("click", () => {
      if (confirm("Clear all local review decisions?")) {
        decisions = {};
        saveDecisions();
      }
    });

    function bootFromCsv(text) {
      groups = groupRows(parseCsv(text));
      render();
    }

    fetch(CSV_PATH)
      .then((res) => {
        if (!res.ok) throw new Error(`Could not load ${CSV_PATH}`);
        return res.text();
      })
      .then(bootFromCsv)
      .catch((error) => {
        if (EMBEDDED_CSV) {
          bootFromCsv(EMBEDDED_CSV);
          return;
        }
        document.getElementById("list").innerHTML = `<div class="empty">${escapeHtml(error.message)}. Serve this folder over localhost so the page can fetch the CSV.</div>`;
      });
  </script>
</body>
</html>
